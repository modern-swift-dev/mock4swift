pre-commit:
  commands:
    format-and-lint-swift:
      glob: "*.swift"
      run: >-
        mint run --no-install nicklockwood/SwiftFormat {staged_files} --config .swiftformat --quiet &&
        mint run --no-install realm/SwiftLint lint --fix --config .swiftlint.yml --quiet {staged_files} &&
        mint run --no-install realm/SwiftLint lint --config .swiftlint.yml --quiet {staged_files}
      stage_fixed: true
